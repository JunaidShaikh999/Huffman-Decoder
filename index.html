<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman Decoder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }
        .output-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1rem;
            color: #2b2b2b;
            word-wrap: break-word;
            white-space: pre-wrap;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error {
            color: #d9534f;
            font-weight: 500;
        }
        .success {
            color: #2e7d32;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎉 Decoded Message</h1>
        <div id="result" class="output-box">Processing URL data...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const resultDiv = document.getElementById('result');
            
            // Extract parameters from URL
            const urlParams = new URLSearchParams(window.location.search);
            const bits = urlParams.get('bits');
            const keyParam = urlParams.get('key');

            if (!bits || !keyParam) {
                resultDiv.className = "output-box error";
                resultDiv.innerText = "No Huffman data found in link.";
                return;
            }

            try {
                const reverseDict = {};

                // Parse keyParam formatted as "ASCII_code-ASCII_code"
                const pairs = keyParam.split('-').filter(Boolean);
                pairs.forEach(pair => {
                    const [charCode, code] = pair.split('_');
                    if (charCode && code) {
                        const symbol = String.fromCharCode(parseInt(charCode, 10));
                        reverseDict[code] = symbol;
                    }
                });

                // Decode Bitstring
                let decodedText = '';
                let currentCode = '';

                for (let bit of bits) {
                    currentCode += bit;
                    if (reverseDict[currentCode] !== undefined) {
                        decodedText += reverseDict[currentCode];
                        currentCode = '';
                    }
                }

                if (decodedText.length === 0) {
                    resultDiv.className = "output-box error";
                    resultDiv.innerText = "Failed to decode message.";
                } else {
                    resultDiv.className = "output-box success";
                    resultDiv.innerText = decodedText;
                }

            } catch (err) {
                resultDiv.className = "output-box error";
                resultDiv.innerText = "Error parsing URL payload.";
                console.error(err);
            }
        });
    </script>
</body>
</html>
